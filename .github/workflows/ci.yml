name: Build

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths-ignore:
      - 'README*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    uses: ./.github/workflows/build.yml
    if: ${{ github.event_name != 'push' || github.event.head_commit == null || !startsWith(github.event.head_commit.message, '[skip ci]') }}
    with:
      java_version: '21'
    secrets: inherit

  release:
    name: Publish release
    needs: build
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ github.ref == 'refs/heads/main' && 'nightly' || github.ref_name }}
      release_title: ${{ github.ref == 'refs/heads/main' && 'Nightly Build' || 'Release' }}
      delete_existing_assets: ${{ github.ref == 'refs/heads/main' }}
      version_name: ${{ needs.build.outputs.version_name }}
      version_code: ${{ needs.build.outputs.version_code }}
      commit_sha: ${{ needs.build.outputs.commit_sha }}
      commit_url: ${{ needs.build.outputs.commit_url }}
      build_duration: ${{ needs.build.outputs.build_duration }}
      release_apk_name: ${{ needs.build.outputs.release_apk_name }}
      debug_apk_name: ${{ needs.build.outputs.debug_apk_name }}
      release_sha256: ${{ needs.build.outputs.release_sha256 }}
      debug_sha256: ${{ needs.build.outputs.debug_sha256 }}
    secrets: inherit
